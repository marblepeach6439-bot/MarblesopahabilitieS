name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B package
      - name: Make sure the jar really contains the plugin code
        run: |
          unzip -l target/MarblesOPAHAbilities.jar
          unzip -l target/MarblesOPAHAbilities.jar | grep -q 'dev/marbles/opah/MarblesPlugin.class'
      - uses: actions/upload-artifact@v4
        with:
          name: MarblesOPAHAbilities
          path: target/MarblesOPAHAbilities.jar
